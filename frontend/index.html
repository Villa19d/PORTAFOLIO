<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!-- favicon placeholder -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Rodrigo Del Villar" />
    <meta name="theme-color" content="#ffffff" />
    
    <!-- Open Graph Placeholder -->
    <meta property="og:title" content="Portfolio Placeholder" />
    <meta property="og:description" content="Portfolio Description Placeholder" />
    <meta property="og:image" content="/placeholder-og.jpg" />
    
    <!-- Twitter Card Placeholder -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portfolio Placeholder" />
    <meta name="twitter:description" content="Portfolio Description Placeholder" />
    <meta name="twitter:image" content="/placeholder-twitter.jpg" />

    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          // Dark por defecto en fallback
          if (savedTheme === null && !window.matchMedia('(prefers-color-scheme: dark)').matches && !window.matchMedia('(prefers-color-scheme: light)').matches) {
            isDark = true;
          }
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

    <title>Rodrigo Del Villar | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
