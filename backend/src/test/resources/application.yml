spring:
  application:
    name: portfolio
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USER:test}
    password: ${DB_PASSWORD:test}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

portfolio:
  security:
    jwt-secret: dummy_secret_key_that_is_at_least_32_bytes_long
    admin-username: admin
    admin-password-hash: $2a$10$w4R4eJg/Gz6U8qU9kMvSce9SgR1h.l8w8m0dGZ/Y1rN/1bWb6M3V2 # 'password'
    cookie-secure: false
