spring:
  application:
    name: portfolio
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

portfolio:
  security:
    jwt-secret: ${JWT_SECRET}
    admin-username: ${ADMIN_USERNAME}
    admin-password-hash: ${ADMIN_PASSWORD_HASH}
    cookie-secure: ${COOKIE_SECURE:true}
  rate-limit:
    enabled: true
    bucket-capacity: 10000
    bucket-expiration-hours: 1
    rules:
      - method: POST
        pathPattern: /api/auth/login
        bandwidths:
          - capacity: 5
            duration: PT1M
          - capacity: 20
            duration: PT1H
      - method: POST
        pathPattern: /api/auth/refresh
        bandwidths:
          - capacity: 30
            duration: PT1M
      - method: POST
        pathPattern: /api/contact
        bandwidths:
          - capacity: ${RATE_LIMIT_CONTACT_CAPACITY:3}
            duration: PT1H
