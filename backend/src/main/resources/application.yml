spring:
  application:
    name: portfolio
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

portfolio:
  security:
    jwt-secret: ${JWT_SECRET}
    admin-username: ${ADMIN_USERNAME}
    admin-password-hash: ${ADMIN_PASSWORD_HASH}
    cookie-secure: ${COOKIE_SECURE:true}
  rate-limit:
    enabled: true
    bucket-capacity: 10000
    bucket-expiration-hours: 1
    rules:
      - method: POST
        pathPattern: /api/auth/login
        bandwidths:
          - capacity: 5
            duration: PT1M
          - capacity: 20
            duration: PT1H
      - method: POST
        pathPattern: /api/auth/refresh
        bandwidths:
          - capacity: 30
            duration: PT1M
      - method: POST
        pathPattern: /api/contact
        bandwidths:
          - capacity: 3
            duration: PT1H
      - method: POST
        pathPattern: /api/admin/uploads/sign
        bandwidths:
          - capacity: 20
            duration: PT1H
  contact:
    resend-api-key: ${RESEND_API_KEY:}
    to-email: ${CONTACT_TO_EMAIL:}
    from: ${CONTACT_FROM:}
    turnstile-secret-key: ${TURNSTILE_SECRET_KEY:}
    turnstile-allowed-hostnames: ${TURNSTILE_ALLOWED_HOSTNAMES:}
    daily-cap: ${CONTACT_DAILY_CAP:40}
    mode: ${CONTACT_MODE:resend}
    retention-days: ${CONTACT_RETENTION_DAYS:30}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET:}
    folder: ${CLOUDINARY_FOLDER:portfolio/projects}
